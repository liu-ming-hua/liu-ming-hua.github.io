<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">Logical Graph Uncertainty overview</title><desc id="desc">Sampled answers become semantic clusters. Entailment links specific answers to a general answer, while incompatibility marks conflicting specific answers. Both relations inform the uncertainty score.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#9c6a56"/></marker></defs>
<rect width="960" height="350" rx="12" fill="#f2f5f1"/>
<text x="38" y="48" fill="#36505a" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">FROM RESPONSES TO LOGICAL RELATIONS</text>
<rect x="38" y="80" width="223" height="210" rx="10" fill="#fff" stroke="#d0dcd5"/><text x="58" y="111" fill="#98614c" font-family="Arial,sans-serif" font-size="13" font-weight="700">Sampled answers</text>
<rect x="58" y="129" width="182" height="37" rx="5" fill="#eaf0ed"/><text x="72" y="153" fill="#19333c" font-family="Arial,sans-serif" font-size="14">“in the 1920s”</text>
<rect x="58" y="177" width="182" height="37" rx="5" fill="#eaf0ed"/><text x="72" y="201" fill="#19333c" font-family="Arial,sans-serif" font-size="14">“in 1926”</text>
<rect x="58" y="225" width="182" height="37" rx="5" fill="#eaf0ed"/><text x="72" y="249" fill="#19333c" font-family="Arial,sans-serif" font-size="14">“in 1929”</text>
<path d="M270 185H337" stroke="#9c6a56" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="80" width="290" height="210" rx="10" fill="#fff" stroke="#d0dcd5"/><text x="370" y="111" fill="#98614c" font-family="Arial,sans-serif" font-size="13" font-weight="700">Entailment + incompatibility</text>
<rect x="444" y="127" width="100" height="32" rx="16" fill="#eaf0ed"/><text x="459" y="148" fill="#19333c" font-family="Arial,sans-serif" font-size="13">1920s</text>
<rect x="377" y="221" width="94" height="32" rx="16" fill="#f3e6df"/><text x="397" y="242" fill="#19333c" font-family="Arial,sans-serif" font-size="13">1926</text>
<rect x="518" y="221" width="94" height="32" rx="16" fill="#f3e6df"/><text x="537" y="242" fill="#19333c" font-family="Arial,sans-serif" font-size="13">1929</text>
<path d="M431 219 472 161M565 219 516 161" stroke="#78948b" stroke-width="2" marker-end="url(#arrow)"/><path d="M475 237H514" stroke="#b9694c" stroke-width="3" stroke-dasharray="5 4"/><text x="475" y="277" fill="#98614c" font-family="Arial,sans-serif" font-size="11">conflict</text>
<path d="M649 185H716" stroke="#9c6a56" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="80" width="191" height="210" rx="10" fill="#19333c"/><text x="751" y="115" fill="#d7e3dd" font-family="Arial,sans-serif" font-size="13" font-weight="700">LGU score</text><text x="751" y="153" fill="#fff" font-family="Arial,sans-serif" font-size="17">Implication-aware</text><text x="751" y="180" fill="#fff" font-family="Arial,sans-serif" font-size="17">entropy</text><path d="M751 201H899" stroke="#6d8583"/><text x="751" y="231" fill="#fff" font-family="Arial,sans-serif" font-size="16">× conflict factor</text><text x="751" y="263" fill="#bc8067" font-family="Arial,sans-serif" font-size="12">More conflict → higher UQ</text>
<text x="38" y="323" fill="#677a79" font-family="Arial,sans-serif" font-size="12">Illustrative schematic redrawn from the research idea; not a figure copied from the paper.</text>
