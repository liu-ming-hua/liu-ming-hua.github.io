<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">Protein phosphorylation prediction pipeline</title><desc id="desc">A 111-residue protein sequence window is encoded by ESM-2, classified by an FCNN to estimate phosphorylation-site probability, and used alongside PTMiner mass-spectrometry evidence for site localization.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#9c6a56"/></marker></defs><rect width="960" height="350" rx="12" fill="#f2f5f1"/>
<text x="37" y="48" fill="#36505a" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">FROM PROTEIN SEQUENCE TO SITE EVIDENCE</text>
<rect x="37" y="91" width="202" height="171" rx="10" fill="#fff" stroke="#d0dcd5"/><text x="58" y="121" fill="#98614c" font-family="Arial,sans-serif" font-size="13" font-weight="700">Sequence window</text><text x="58" y="165" fill="#19333c" font-family="monospace" font-size="17">…GKS<span fill="#b9694c">S</span>PR…</text><text x="58" y="215" fill="#66787b" font-family="Arial,sans-serif" font-size="12">111 amino acids · S/T/Y center</text>
<path d="M248 177H287" stroke="#9c6a56" stroke-width="2" marker-end="url(#a)"/>
<rect x="300" y="91" width="173" height="171" rx="10" fill="#fff" stroke="#d0dcd5"/><text x="320" y="122" fill="#98614c" font-family="Arial,sans-serif" font-size="13" font-weight="700">ESM-2</text><text x="320" y="171" fill="#19333c" font-family="Georgia,serif" font-size="25">Protein</text><text x="320" y="199" fill="#19333c" font-family="Georgia,serif" font-size="25">representation</text>
<path d="M482 177H521" stroke="#9c6a56" stroke-width="2" marker-end="url(#a)"/>
<rect x="534" y="91" width="163" height="171" rx="10" fill="#fff" stroke="#d0dcd5"/><text x="554" y="122" fill="#98614c" font-family="Arial,sans-serif" font-size="13" font-weight="700">FCNN</text><text x="554" y="171" fill="#19333c" font-family="Georgia,serif" font-size="24">Site</text><text x="554" y="199" fill="#19333c" font-family="Georgia,serif" font-size="24">probability</text>
<path d="M706 177H745" stroke="#9c6a56" stroke-width="2" marker-end="url(#a)"/>
<rect x="758" y="91" width="164" height="171" rx="10" fill="#19333c"/><text x="779" y="122" fill="#d7e3dd" font-family="Arial,sans-serif" font-size="13" font-weight="700">PTMiner context</text><text x="779" y="171" fill="#fff" font-family="Georgia,serif" font-size="23">Candidate</text><text x="779" y="199" fill="#fff" font-family="Georgia,serif" font-size="23">localization</text>
<text x="37" y="314" fill="#677a79" font-family="Arial,sans-serif" font-size="12">The sequence model supplements—not replaces—mass-spectrometry evidence when site-determining ions are absent.</text>
</svg>
