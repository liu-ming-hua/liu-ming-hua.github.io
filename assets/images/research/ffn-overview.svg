<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">Sparse FFN perturbation overview</title><desc id="desc">A fixed generated answer is evaluated by running several forward passes. Sparse noise is added to selected feed-forward activations; variation in the selected token probability becomes an uncertainty score.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#9c6a56"/></marker></defs><rect width="960" height="350" rx="12" fill="#f2f5f1"/>
<text x="38" y="48" fill="#36505a" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">A LOCAL STRESS TEST FOR MODEL INTERNALS</text>
<rect x="38" y="91" width="203" height="174" rx="10" fill="#fff" stroke="#d0dcd5"/><text x="58" y="121" fill="#98614c" font-family="Arial,sans-serif" font-size="13" font-weight="700">Fixed generated token</text><text x="58" y="166" fill="#19333c" font-family="Georgia,serif" font-size="28">“Paris”</text><text x="58" y="227" fill="#66787b" font-family="Arial,sans-serif" font-size="12">Generation is unchanged</text>
<path d="M250 177H311" stroke="#9c6a56" stroke-width="2" marker-end="url(#a)"/>
<rect x="325" y="91" width="287" height="174" rx="10" fill="#fff" stroke="#d0dcd5"/><text x="347" y="121" fill="#98614c" font-family="Arial,sans-serif" font-size="13" font-weight="700">Perturb FFN activations</text>
<g fill="#d6e1dc"><circle cx="364" cy="166" r="9"/><circle cx="399" cy="166" r="9"/><circle cx="434" cy="166" r="9"/><circle cx="469" cy="166" r="9"/><circle cx="504" cy="166" r="9"/><circle cx="539" cy="166" r="9"/><circle cx="574" cy="166" r="9"/><circle cx="364" cy="204" r="9"/><circle cx="399" cy="204" r="9"/><circle cx="434" cy="204" r="9"/><circle cx="469" cy="204" r="9"/><circle cx="504" cy="204" r="9"/><circle cx="539" cy="204" r="9"/><circle cx="574" cy="204" r="9"/></g><g fill="#b9694c"><circle cx="399" cy="166" r="9"/><circle cx="539" cy="166" r="9"/><circle cx="469" cy="204" r="9"/></g><text x="347" y="243" fill="#66787b" font-family="Arial,sans-serif" font-size="12">Sparse mask + Gaussian noise</text>
